[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craftmind-agent"
version = "0.1.0"
description = "Local Minecraft agent for Craftmind"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
craftmind = "craftmind.cli:main"

[tool.setuptools.packages.find]
include = ["craftmind*"]
